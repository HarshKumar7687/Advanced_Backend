services:
  nginx:
    image: nginx:latest
    container_name: nginx_load_balancer
    ports:
      - 8000:80
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
  server1: 
    build: ./server
    env_file:
      - ./server/.env 
    environment:
      - SERVER_NAME="PEHLA SERVER 1"
    ports:
      - 5001:7000
    
  server2: 
    build: ./server
    env_file:
      - ./server/.env 
    environment:
      - SERVER_NAME="DOOSRA SERVER 2"
    ports:
      - 5002:7000

  server3: 
    build: ./server
    env_file:
      - ./server/.env 
    environment:
      - SERVER_NAME="THEESRA SERVER 3"
    ports:
      - 5003:7000
    
    